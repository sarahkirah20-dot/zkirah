['#ffc8dd','Simple circuit','','A simple circuit has an emf source (E), internal resistance r and external resistance R.<br>Ammeter in <b>series</b> (very low resistance) · voltmeter in <b>parallel</b> (very high resistance).<br>Conventional current flows + → − outside the source; electrons flow − → +.'],
['#fff1a8','Electromotive force E','','The energy the source gives to each unit of charge passing through the whole circuit.<div class=eq>E = W / q &nbsp; (volt)</div>'],
['#c7f2d4','Charge & current','','<div class=eq>Q = I t = N e , e = 1.6×10⁻¹⁹ C</div>1 ampere = 1 coulomb per second. N is the number of electrons.'],
['#bde0fe',"Ohm's law — part of a circuit",'','<div class=eq>V = I R , R = V / I , V = W / q</div>1 volt = 1 joule / coulomb. Potential difference is the work per unit charge between two points. Valid at constant temperature.'],
['#ffd7b5',"Ohm's law — complete circuit",'','<div class=eq>I = E / (R + r)</div><div class=eq>E = I R + I r = V<sub>B</sub> + I r</div><div class=eq>V<sub>B</sub> = E − I r</div>E is the emf. V<sub>B</sub> is the terminal voltage across the battery and equals I·R. In an open circuit V<sub>B</sub> = E.','add'],
['#d9c8ff','Resistance factors','','<div class=eq>R = ρ L / A &nbsp;⇒&nbsp; ρ = R A / L (Ω·m)</div>R ∝ L , R ∝ 1/A , and it depends on the material (ρ). Conductivity: <div class=eq>σ = 1/ρ (Ω⁻¹·m⁻¹ = S/m)</div>The resistance of metals rises as temperature rises.','add'],
['#ffc8dd','Resistors in series','','<div class=eq>R<sub>t</sub> = R₁ + R₂ + R₃ + …</div>Same current everywhere: I = I₁ = I₂, and V = V₁ + V₂ + … Total resistance grows with the number of resistors.'],
['#c7f2d4','Resistors in parallel','','<div class=eq>1/R<sub>t</sub> = 1/R₁ + 1/R₂ + …</div><div class=eq>Two resistors: R<sub>t</sub> = R₁R₂ / (R₁+R₂)</div>Same potential difference V = V₁ = V₂, current I = I₁ + I₂ + …, and n equal resistors give R<sub>t</sub> = R/n.'],
['#bde0fe',"Kirchhoff's laws",'','<b>First law:</b> ΣI<sub>in</sub> = ΣI<sub>out</sub> at any junction (conservation of charge).<br><b>Second law:</b> ΣV = 0 around any closed loop, or ΣE = ΣIR (conservation of energy).'],
['#fff1a8','Power & energy','','<div class=eq>P = W/t = V I = I²R = V²/R (watt)</div><div class=eq>W = P t = V I t = I²R t = V²t / R (J)</div>1 kilowatt-hour = 3.6×10⁶ J.','add'],
['#d9c8ff','Combining batteries','','<b>Series:</b> E<sub>e</sub> = nE , r<sub>e</sub> = n r — raises the available voltage.<br><b>Parallel:</b> E<sub>e</sub> = E , r<sub>e</sub> = r / n — raises the available current.'],
['#ffd7b5','Modes of connection','','1) Series · 2) Parallel · 3) Mixed. Solve with Ohm\'s law, Kirchhoff\'s laws and equivalent resistance: reduce the series and parallel parts step by step.']];
